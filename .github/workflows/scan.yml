name: Funding Radar Scan

on:
  schedule:
    # 07:00 UTC every Monday (09:00 Girona in summer). Edit the cron to change frequency.
    - cron: "0 7 * * 1"
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    # Hard cap so a stalled request can never hang the workflow indefinitely -
    # a normal run takes well under a minute.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run scan
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          DASHBOARD_URL: "https://aravind091.github.io/Funding_radar/"
        run: python scan.py
      - name: Commit updated data
        run: |
          git config user.name "funding-radar-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Update funding radar data [skip ci]"
          git push
